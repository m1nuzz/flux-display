name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core unit tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FluxDisplay.Core/FluxDisplay.Core.csproj
      - name: Build Core
        run: dotnet build src/FluxDisplay.Core/FluxDisplay.Core.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=core-tests.trx"
      - name: Smoke check required project files
        shell: bash
        run: |
          test -f FluxDisplay.sln
          test -f src/FluxDisplay.Core/FluxDisplay.Core.csproj
          test -f tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
          grep -q "FluxDisplay.Core" FluxDisplay.sln
          grep -q "FluxDisplay.Core.Tests" FluxDisplay.sln

  windows-build:
    name: Windows portable + EXE installer build
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        run: msbuild FluxDisplay.sln /t:Restore /p:Configuration=Release /p:Platform=x64
        env:
          Configuration: Release

      - name: Run App smoke tests (automated, replaces Windows MCP)
        shell: pwsh
        run: |
          dotnet test tests/FluxDisplay.App.Tests/FluxDisplay.App.Tests.csproj --configuration Release -p:Platform=x64 --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./scripts/smoke.ps1 -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish portable x64 (unpackaged, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish src/FluxDisplay.App/FluxDisplay.App.csproj `
            --configuration Release `
            --framework net8.0-windows10.0.22621.0 `
            --runtime win-x64 `
            --self-contained true `
            --output ./artifacts/FluxDisplay-win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:GenerateAppxPackageOnBuild=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host '--- XAML/compiler diagnostic files ---'
            Get-ChildItem -Path . -Recurse -File -Include input.json,output.json,*.log -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              }
            exit $exitCode
          }

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-ui-smoke
          path: |
            artifacts/ui-smoke/**
            artifacts/smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload XAML compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-xaml-diagnostics
          path: |
            src/FluxDisplay.App/obj/**/input.json
            src/FluxDisplay.App/obj/**/output.json
          if-no-files-found: warn
          retention-days: 7

      - name: Add portable launch instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay portable build

          1. Extract this ZIP on Windows 11 x64.
          2. Run `FluxDisplay.App.exe`.
          3. Windows App SDK runtime is included in this self-contained build.
          4. The application is currently an unpackaged desktop build; no installer is required.
          '@ | Set-Content ./artifacts/FluxDisplay-win-x64/README.txt

      - name: Stage portable folder
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'artifacts/dist'
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          $target = Join-Path $dist 'Flux Display'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path './artifacts/FluxDisplay-win-x64/*' -Destination $target -Recurse -Force -ErrorAction Stop

      - name: Build EXE installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc installer/FluxDisplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item ./artifacts/FluxDisplay-win-x64-setup.exe | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host

      - name: Write setup instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay setup (EXE installer, no certificate needed)

          1. Run `FluxDisplay-win-x64-setup.exe` and follow the wizard.
          2. No admin rights required (installs into your LocalAppData).
          3. Windows SmartScreen may warn about an unknown publisher: choose "More info" -> "Run anyway".
             (Expected: the build is not code-signed with a commercial certificate.)
          4. Portable version is also available (FluxDisplay-win-x64-portable artifact, no install required).
          '@ | Set-Content ./artifacts/INSTALL-SETUP.txt

      - name: Write setup checksum
        shell: pwsh
        run: |
          $h = Get-FileHash -LiteralPath './artifacts/FluxDisplay-win-x64-setup.exe' -Algorithm SHA256 -ErrorAction Stop
          Set-Content -LiteralPath './artifacts/FluxDisplay-win-x64-setup.sha256' -Value ("$($h.Hash.ToLowerInvariant())  FluxDisplay-win-x64-setup.exe`n") -NoNewline -Encoding utf8NoBOM -ErrorAction Stop

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          # Portable: hash every staged file, paths relative to artifacts/dist.
          # The sums file itself lives outside the hashed tree (dist root).
          $distRoot = Join-Path $PWD 'artifacts/dist'
          $portableLines = Get-ChildItem -LiteralPath (Join-Path $distRoot 'Flux Display') -Recurse -File -ErrorAction Stop | ForEach-Object {
            $h = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 -ErrorAction Stop
            $rel = $_.FullName.Substring($distRoot.Length + 1).Replace('\', '/')
            "$($h.Hash.ToLowerInvariant())  $rel"
          }
          if (-not $portableLines) { throw 'No staged portable files found for checksums.' }
          Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Value (($portableLines -join "`n") + "`n") -NoNewline -Encoding utf8NoBOM -ErrorAction Stop

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-portable
          path: ./artifacts/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-installer
          path: |
            ./artifacts/FluxDisplay-win-x64-setup.exe
            ./artifacts/INSTALL-SETUP.txt
            ./artifacts/FluxDisplay-win-x64-setup.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release (stable download links for reputation)
    runs-on: ubuntu-latest
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxDisplay-win-x64-installer
          path: ./release-assets
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxDisplay-win-x64-portable
          path: ./release-portable
      - name: Pack portable ZIP
        run: |
          cd ./release-portable
          zip -r ../release-assets/FluxDisplay-win-x64-portable.zip "Flux Display"
          cd ../release-assets
          sha256sum FluxDisplay-win-x64-portable.zip | awk '{ print $1 "  FluxDisplay-win-x64-portable.zip" }' > FluxDisplay-win-x64-portable.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/FluxDisplay-win-x64-setup.exe
            ./release-assets/FluxDisplay-win-x64-portable.zip
            ./release-assets/INSTALL-SETUP.txt
            ./release-assets/FluxDisplay-win-x64-setup.sha256
            ./release-assets/FluxDisplay-win-x64-portable.sha256
          body: |
            `FluxDisplay-win-x64-setup.exe` — installer, no admin rights required.
            `FluxDisplay-win-x64-portable.zip` — unpack and run `Flux Display/FluxDisplay.App.exe`, no install.
            No certificate yet, so the first downloads may show a SmartScreen / Chrome
            reputation warning — the files are clean, verify via the `.sha256` files.
