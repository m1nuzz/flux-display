name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core unit tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FluxDisplay.Core/FluxDisplay.Core.csproj
      - name: Build Core
        run: dotnet build src/FluxDisplay.Core/FluxDisplay.Core.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=core-tests.trx"
      - name: Smoke check required project files
        shell: bash
        run: |
          test -f FluxDisplay.sln
          test -f src/FluxDisplay.Core/FluxDisplay.Core.csproj
          test -f tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
          grep -q "FluxDisplay.Core" FluxDisplay.sln
          grep -q "FluxDisplay.Core.Tests" FluxDisplay.sln

  windows-portable-build:
    name: Windows portable application build
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WinUI application
        run: dotnet restore src/FluxDisplay.App/FluxDisplay.App.csproj -p:Platform=x64

      - name: Publish portable x64 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish src/FluxDisplay.App/FluxDisplay.App.csproj `
            --configuration Release `
            --framework net8.0-windows10.0.22621.0 `
            --runtime win-x64 `
            --self-contained true `
            --output ./artifacts/FluxDisplay-win-x64 `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host '--- XAML/compiler diagnostic files ---'
            Get-ChildItem -Path . -Recurse -File -Include input.json,output.json,*.log -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              }
            exit $exitCode
          }

      - name: Upload XAML compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-xaml-diagnostics
          path: |
            src/FluxDisplay.App/obj/**/input.json
            src/FluxDisplay.App/obj/**/output.json
          if-no-files-found: warn
          retention-days: 7

      - name: Add portable launch instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay portable build

          1. Extract this ZIP on Windows 11 x64.
          2. Run `FluxDisplay.App.exe`.
          3. Windows App SDK runtime is included in this self-contained build.
          4. The application is currently an unpackaged desktop build; no installer is required.
          '@ | Set-Content ./artifacts/FluxDisplay-win-x64/README.txt

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/FluxDisplay-win-x64/* -DestinationPath ./artifacts/FluxDisplay-win-x64-portable.zip

      - name: Prepare installer package files
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD 'artifacts/msix-package'
          New-Item -ItemType Directory -Force -Path "$packageRoot/Assets" | Out-Null
          Copy-Item './artifacts/FluxDisplay-win-x64/*' $packageRoot -Recurse -Force
          $png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          [IO.File]::WriteAllBytes("$packageRoot/Assets/StoreLogo.png", [Convert]::FromBase64String($png))
          [IO.File]::WriteAllBytes("$packageRoot/Assets/Square44x44Logo.png", [Convert]::FromBase64String($png))
          [IO.File]::WriteAllBytes("$packageRoot/Assets/Square150x150Logo.png", [Convert]::FromBase64String($png))
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" IgnorableNamespaces="uap">
            <Identity Name="m1nuzz.fluxdisplay" Publisher="CN=FluxDisplay" Version="1.0.0.0" />
            <Properties>
              <DisplayName>FluxDisplay</DisplayName>
              <PublisherDisplayName>FluxDisplay</PublisherDisplayName>
              <Logo>Assets/StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.22621.0" MaxVersionTested="10.0.26100.0" />
            </Dependencies>
            <Applications>
              <Application Id="FluxDisplay" Executable="FluxDisplay.App.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements AppListEntry="none" DisplayName="FluxDisplay" Description="Display preset manager" Square44x44Logo="Assets/Square44x44Logo.png" Square150x150Logo="Assets/Square150x150Logo.png" />
              </Application>
            </Applications>
          </Package>
          '@ | Set-Content "$packageRoot/AppxManifest.xml" -Encoding UTF8

      - name: Create MSIX installer
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "$env:ProgramFiles (x86)/Windows Kits/10/bin" -Filter MakeAppx.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found on the Windows runner.' }
          & $makeAppx.FullName pack /d "$PWD/artifacts/msix-package" /p "$PWD/artifacts/FluxDisplay-win-x64-installer.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign MSIX installer with CI test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=FluxDisplay' -CertStoreLocation 'Cert:\CurrentUser\My'
          $pfxPath = Join-Path $PWD 'artifacts/FluxDisplay-ci-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/FluxDisplay-ci-signing.cer'
          $password = ConvertTo-SecureString 'FluxDisplay-CI-Only' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          $signtool = Get-ChildItem "$env:ProgramFiles (x86)/Windows Kits/10/bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p 'FluxDisplay-CI-Only' "$PWD/artifacts/FluxDisplay-win-x64-installer.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfxPath -Force

      - name: Create installer ZIP and install instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay installer

          1. Import `FluxDisplay-ci-signing.cer` into Trusted People if Windows blocks the test-signed package.
          2. Double-click `FluxDisplay-win-x64-installer.msix` and choose Install.
          3. The certificate is for CI/testing only and is not a commercial publisher certificate.
          '@ | Set-Content ./artifacts/INSTALL-MSIX.txt
          Compress-Archive -Path ./artifacts/FluxDisplay-win-x64-installer.msix,./artifacts/FluxDisplay-ci-signing.cer,./artifacts/INSTALL-MSIX.txt -DestinationPath ./artifacts/FluxDisplay-win-x64-installer.zip

      - name: Upload portable and installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-distributions
          path: |
            ./artifacts/FluxDisplay-win-x64-portable.zip
            ./artifacts/FluxDisplay-win-x64-installer.zip
            ./artifacts/FluxDisplay-win-x64-installer.msix
            ./artifacts/FluxDisplay-ci-signing.cer
            ./artifacts/INSTALL-MSIX.txt
          if-no-files-found: error
          retention-days: 14
