name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core unit tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FluxDisplay.Core/FluxDisplay.Core.csproj
      - name: Build Core
        run: dotnet build src/FluxDisplay.Core/FluxDisplay.Core.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=core-tests.trx"
      - name: Smoke check required project files
        shell: bash
        run: |
          test -f FluxDisplay.sln
          test -f src/FluxDisplay.Core/FluxDisplay.Core.csproj
          test -f tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
          grep -q "FluxDisplay.Core" FluxDisplay.sln
          grep -q "FluxDisplay.Core.Tests" FluxDisplay.sln

  windows-build:
    name: Windows portable + MSIX build
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create test signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=FluxDisplay' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(2)
          $pfxPath = Join-Path $PWD 'GitHubActionsWorkflow.pfx'
          $cerPath = Join-Path $PWD 'artifacts/FluxDisplay-ci-signing.cer'
          $password = ConvertTo-SecureString 'FluxDisplay-CI-Only' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          Write-Host "Created test certificate for CN=FluxDisplay"

      - name: Restore solution
        run: msbuild FluxDisplay.sln /t:Restore /p:Configuration=Release /p:Platform=x64
        env:
          Configuration: Release

      - name: Publish portable x64 (unpackaged, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish src/FluxDisplay.App/FluxDisplay.App.csproj `
            --configuration Release `
            --framework net8.0-windows10.0.22621.0 `
            --runtime win-x64 `
            --self-contained true `
            --output ./artifacts/FluxDisplay-win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:GenerateAppxPackageOnBuild=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host '--- XAML/compiler diagnostic files ---'
            Get-ChildItem -Path . -Recurse -File -Include input.json,output.json,*.log -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              }
            exit $exitCode
          }

      - name: Upload XAML compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-xaml-diagnostics
          path: |
            src/FluxDisplay.App/obj/**/input.json
            src/FluxDisplay.App/obj/**/output.json
          if-no-files-found: warn
          retention-days: 7

      - name: Add portable launch instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay portable build

          1. Extract this ZIP on Windows 11 x64.
          2. Run `FluxDisplay.App.exe`.
          3. Windows App SDK runtime is included in this self-contained build.
          4. The application is currently an unpackaged desktop build; no installer is required.
          '@ | Set-Content ./artifacts/FluxDisplay-win-x64/README.txt

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/FluxDisplay-win-x64/* -DestinationPath ./artifacts/FluxDisplay-win-x64-portable.zip -Force

      - name: Build MSIX package (single-project MSIX)
        shell: pwsh
        run: |
          $pfxPath = Join-Path $PWD 'GitHubActionsWorkflow.pfx'
          if (-not (Test-Path $pfxPath)) { throw "Signing certificate PFX not found at $pfxPath" }
          $pkgDir = Join-Path $PWD 'artifacts/Packages'
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          msbuild FluxDisplay.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:PackageCertificateKeyFile="$pfxPath" `
            /p:PackageCertificatePassword=FluxDisplay-CI-Only `
            /p:AppxPackageDir="$pkgDir\\" `
            /p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSIX build completed. Listing Packages directory:"
          Get-ChildItem -Path "$pkgDir" -Recurse | Format-Table FullName, Length -AutoSize | Out-String -Width 300 | Write-Host

      - name: Normalize MSIX artifact name
        shell: pwsh
        run: |
          $pkgDir = Join-Path $PWD 'artifacts/Packages'
          $msix = Get-ChildItem -Path $pkgDir -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) {
            Write-Host "No MSIX found under $pkgDir, searching whole repo"
            Get-ChildItem -Path . -Filter *.msix -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "MSIX package was not generated."
          }
          $dest = Join-Path $PWD 'artifacts/FluxDisplay-win-x64-installer.msix'
          Copy-Item -LiteralPath $msix.FullName -Destination $dest -Force
          Write-Host "Copied MSIX $($msix.FullName) -> $dest ($([math]::Round((Get-Item $dest).Length/1MB,2)) MB)"

      - name: Remove PFX after build
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $PWD 'GitHubActionsWorkflow.pfx'
          if (Test-Path $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue }

      - name: Create installer ZIP and install instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay installer (MSIX, test-signed)

          1. Import `FluxDisplay-ci-signing.cer` into Trusted People if Windows blocks the test-signed package.
             - Double-click the .cer -> Install Certificate -> Local Machine -> Place all certificates in Trusted People.
          2. Double-click `FluxDisplay-win-x64-installer.msix` and choose Install.
          3. The certificate is for CI/testing only and is not a commercial publisher certificate.
          4. Portable version is also available: FluxDisplay-win-x64-portable.zip (no install required).
          '@ | Set-Content ./artifacts/INSTALL-MSIX.txt
          Compress-Archive -Path ./artifacts/FluxDisplay-win-x64-installer.msix,./artifacts/FluxDisplay-ci-signing.cer,./artifacts/INSTALL-MSIX.txt -DestinationPath ./artifacts/FluxDisplay-win-x64-installer.zip -Force

      - name: Upload portable and installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-distributions
          path: |
            ./artifacts/FluxDisplay-win-x64-portable.zip
            ./artifacts/FluxDisplay-win-x64-installer.zip
            ./artifacts/FluxDisplay-win-x64-installer.msix
            ./artifacts/FluxDisplay-ci-signing.cer
            ./artifacts/INSTALL-MSIX.txt
          if-no-files-found: error
          retention-days: 14
