name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core unit tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FluxDisplay.Core/FluxDisplay.Core.csproj
      - name: Build Core
        run: dotnet build src/FluxDisplay.Core/FluxDisplay.Core.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=core-tests.trx"
      - name: Smoke check required project files
        shell: bash
        run: |
          test -f FluxDisplay.sln
          test -f src/FluxDisplay.Core/FluxDisplay.Core.csproj
          test -f tests/FluxDisplay.Core.Tests/FluxDisplay.Core.Tests.csproj
          grep -q "FluxDisplay.Core" FluxDisplay.sln
          grep -q "FluxDisplay.Core.Tests" FluxDisplay.sln

  windows-build:
    name: Windows portable + EXE installer build
    runs-on: windows-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Write-Host "APP_VERSION=$version"

      - name: Restore solution
        run: msbuild FluxDisplay.sln /t:Restore /p:Configuration=Release /p:Platform=x64
        env:
          Configuration: Release

      - name: Run App smoke tests (automated, replaces Windows MCP)
        shell: pwsh
        run: |
          dotnet test tests/FluxDisplay.App.Tests/FluxDisplay.App.Tests.csproj --configuration Release -p:Platform=x64 --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./scripts/smoke.ps1 -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish portable x64 (unpackaged, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet publish src/FluxDisplay.App/FluxDisplay.App.csproj `
            --configuration Release `
            --framework net8.0-windows10.0.22621.0 `
            --runtime win-x64 `
            --self-contained true `
            --output ./artifacts/FluxDisplay-win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:GenerateAppxPackageOnBuild=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:APP_VERSION
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host '--- XAML/compiler diagnostic files ---'
            Get-ChildItem -Path . -Recurse -File -Include input.json,output.json,*.log -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              }
            exit $exitCode
          }

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-ui-smoke
          path: |
            artifacts/ui-smoke/**
            artifacts/smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload XAML compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-xaml-diagnostics
          path: |
            src/FluxDisplay.App/obj/**/input.json
            src/FluxDisplay.App/obj/**/output.json
          if-no-files-found: warn
          retention-days: 7

      - name: Add portable launch instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay portable build

          1. Extract this ZIP on Windows 11 x64.
          2. Run `FluxDisplay.App.exe`.
          3. Windows App SDK runtime is included in this self-contained build.
          4. The application is currently an unpackaged desktop build; no installer is required.
          '@ | Set-Content ./artifacts/FluxDisplay-win-x64/README.txt

      - name: Stage portable folder
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'artifacts/dist'
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          $target = Join-Path $dist 'Flux Display'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path './artifacts/FluxDisplay-win-x64/*' -Destination $target -Recurse -Force -ErrorAction Stop

      - name: Build EXE installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc installer/FluxDisplay.iss /DMyAppVersion=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Versioned asset name: the updater's strict matcher requires
          # FluxDisplay-<X.Y.Z>-setup.exe with X.Y.Z equal to the release tag.
          $versioned = "FluxDisplay-$env:APP_VERSION-setup.exe"
          Rename-Item -LiteralPath ./artifacts/FluxDisplay-win-x64-setup.exe -NewName $versioned -ErrorAction Stop
          Get-Item "./artifacts/$versioned" | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host

      - name: Verify version contract (assembly == tag == asset name)
        shell: pwsh
        run: |
          $dll = './artifacts/FluxDisplay-win-x64/FluxDisplay.App.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "Published assembly not found at $dll" }
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD $dll)).Version.ToString()
          $expected = "$env:APP_VERSION.0"
          if ($assemblyVersion -ne $expected) { throw "Assembly version $assemblyVersion != tag version $expected" }
          $asset = "FluxDisplay-$env:APP_VERSION-setup.exe"
          if (-not (Test-Path -LiteralPath "./artifacts/$asset")) { throw "Versioned setup asset missing: $asset" }
          Write-Host "Version contract OK: assembly $assemblyVersion, asset $asset"

      - name: Write setup instructions
        shell: pwsh
        run: |
          @'
          # FluxDisplay setup (EXE installer, no certificate needed)

          1. Run `FluxDisplay-<version>-setup.exe` and follow the wizard.
          2. No admin rights required (installs into your LocalAppData).
          3. Windows SmartScreen may warn about an unknown publisher: choose "More info" -> "Run anyway".
             (Expected: the build is not code-signed with a commercial certificate.)
          4. Portable version is also available (FluxDisplay-win-x64-portable artifact, no install required).
          '@ | Set-Content ./artifacts/INSTALL-SETUP.txt

      - name: Write setup checksum
        shell: pwsh
        run: |
          $asset = "FluxDisplay-$env:APP_VERSION-setup.exe"
          $h = Get-FileHash -LiteralPath "./artifacts/$asset" -Algorithm SHA256 -ErrorAction Stop
          $shaName = $asset -replace '\.exe$', '.sha256'
          Set-Content -LiteralPath "./artifacts/$shaName" -Value ("$($h.Hash.ToLowerInvariant())  $asset`n") -NoNewline -Encoding utf8NoBOM -ErrorAction Stop
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_ASSET=$asset"
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_SHA=$shaName"

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          # Portable: hash every staged file, paths relative to artifacts/dist.
          # The sums file itself lives outside the hashed tree (dist root).
          $distRoot = Join-Path $PWD 'artifacts/dist'
          $portableLines = Get-ChildItem -LiteralPath (Join-Path $distRoot 'Flux Display') -Recurse -File -ErrorAction Stop | ForEach-Object {
            $h = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 -ErrorAction Stop
            $rel = $_.FullName.Substring($distRoot.Length + 1).Replace('\', '/')
            "$($h.Hash.ToLowerInvariant())  $rel"
          }
          if (-not $portableLines) { throw 'No staged portable files found for checksums.' }
          Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Value (($portableLines -join "`n") + "`n") -NoNewline -Encoding utf8NoBOM -ErrorAction Stop

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-portable
          path: ./artifacts/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDisplay-win-x64-installer
          path: |
            ./artifacts/FluxDisplay-*-setup.exe
            ./artifacts/INSTALL-SETUP.txt
            ./artifacts/FluxDisplay-*-setup.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release (stable download links for reputation)
    runs-on: ubuntu-latest
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF is not a stable vX.Y.Z release tag."
            exit 1
          fi
          echo "Release tag OK: $GITHUB_REF"
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxDisplay-win-x64-installer
          path: ./release-assets
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: FluxDisplay-win-x64-portable
          path: ./release-portable
      - name: Pack portable ZIP
        run: |
          cd ./release-portable
          zip -r ../release-assets/FluxDisplay-win-x64-portable.zip "Flux Display"
          cd ../release-assets
          sha256sum FluxDisplay-win-x64-portable.zip | awk '{ print $1 "  FluxDisplay-win-x64-portable.zip" }' > FluxDisplay-win-x64-portable.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/FluxDisplay-*-setup.exe
            ./release-assets/FluxDisplay-win-x64-portable.zip
            ./release-assets/INSTALL-SETUP.txt
            ./release-assets/FluxDisplay-*-setup.sha256
            ./release-assets/FluxDisplay-win-x64-portable.sha256
          body: |
            `FluxDisplay-<version>-setup.exe` — installer, no admin rights required.
            `FluxDisplay-win-x64-portable.zip` — unpack and run `Flux Display/FluxDisplay.App.exe`, no install.
            No certificate yet, so the first downloads may show a SmartScreen / Chrome
            reputation warning — the files are clean, verify via the `.sha256` files.
      - name: Verify published asset digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # The updater refuses silent installs without a digest; fail the job
          # if GitHub did not attach a SHA-256 digest to the setup asset.
          DIGEST=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | test("^FluxDisplay-[0-9]+\\.[0-9]+\\.[0-9]+-setup\\.exe$")) | .digest')
          echo "setup asset digest: $DIGEST"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Published setup asset has no valid SHA-256 digest."
            exit 1
          fi
          # The digest must equal the hash of the exact file CI built, not just
          # be well-formed: otherwise clients would verify against nothing.
          SHA_FILE=$(ls ./release-assets/FluxDisplay-*-setup.sha256)
          BUILT_HASH=$(awk '{ print $1 }' "$SHA_FILE" | tr '[:upper:]' '[:lower:]')
          PUBLISHED_HASH=$(echo "${DIGEST#sha256:}" | tr '[:upper:]' '[:lower:]')
          if [[ "$BUILT_HASH" != "$PUBLISHED_HASH" ]]; then
            echo "Digest mismatch: built $BUILT_HASH vs published $PUBLISHED_HASH."
            exit 1
          fi
          echo "Digest matches the built installer."
